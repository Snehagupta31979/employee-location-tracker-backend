# =========================================
# Server
# =========================================
server.port=8080
server.address=0.0.0.0

# =========================================
# Datasource - MySQL
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/EmployeeTrackerDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Qwerty@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
# 'update' lets Hibernate create/update tables automatically on startup,
# so you do NOT need to run sql/schema.sql manually. sql/schema.sql is kept
# in the repo only as an optional reference if you prefer to manage the
# schema yourself (in which case switch this to 'validate').
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================================
# Session
# =========================================
server.servlet.session.timeout=8h
spring.session.timeout=8h

# =========================================
# Tracking configuration (module 4-6)
# =========================================
tracking.stop.radius-meters=30
tracking.stop.duration-minutes=10
tracking.online.threshold-minutes=0
tracking.auto-update.interval-minutes=10

# =========================================
# Data seeding
# =========================================
tracking.seed.enabled=true

# =========================================
# Logging
# =========================================
logging.level.root=INFO
logging.level.com.employeetracker=DEBUG
logging.level.org.springframework.security=INFO
