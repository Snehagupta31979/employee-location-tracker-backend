<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Location Tracker - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="card login-card shadow-lg">

        <div class="login-header">
            <div class="brand-icon">📍</div>
            <h3 class="fw-bold">Employee Location Tracker</h3>
            <p class="small">Real-time GPS attendance &amp; tracking</p>
        </div>

        <div class="login-form-body">

            <!-- ===================== LOGIN VIEW ===================== -->
            <div id="loginWrapper">
                <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                        <span id="loginBtnText">Sign In</span>
                        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>

                <div class="auth-switch-link">
                    Haven't registered? <a href="#" id="showRegisterLink">Register</a>
                </div>

                <hr class="my-4">
                <div class="small text-muted sample-creds-box">
                    <strong>Sample credentials</strong>
                    <table class="table table-sm mt-2 mb-0">
                        <thead><tr><th>Role</th><th>Username</th><th>Password</th></tr></thead>
                        <tbody>
                            <tr><td>Admin</td><td>admin</td><td>password123</td></tr>
                            <tr><td>Employee</td><td>john.smith</td><td>password123</td></tr>
                            <tr><td>Employee</td><td>sarah.johnson</td><td>password123</td></tr>
                            <tr><td>Employee</td><td>michael.brown</td><td>password123</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ===================== REGISTER VIEW ===================== -->
            <div id="registerWrapper" class="d-none">
                <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>
                <div id="registerSuccessAlert" class="alert alert-success d-none" role="alert"></div>

                <form id="registerForm" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="regFullName">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control" id="regFullName" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="regUsername">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="regUsername" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="regEmail">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="regEmail">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="regPassword">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="regPassword" minlength="6" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="regConfirmPassword" minlength="6" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                        <span id="registerBtnText">Register</span>
                        <span id="registerSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>

                <div class="auth-switch-link">
                    Already have an account? <a href="#" id="backToLoginLink">Sign In</a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
